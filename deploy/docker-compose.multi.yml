# 멀티프로세스 봇 배포 설정
#
# 각 봇이 독립 컨테이너로 실행됩니다.
# 오케스트레이터(API+Discord)가 Redis를 통해 제어합니다.
#
# Usage:
#   docker compose -f deploy/docker-compose.multi.yml up -d
#
# 롤백:
#   docker compose -f deploy/docker-compose.yml up -d

version: "3.8"

services:
  # =========================================================================
  # 인프라
  # =========================================================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 오케스트레이터 (API + Discord)
  # =========================================================================

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "src.main"]
    environment:
      - ORCHESTRATOR_MODE=true
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - API_KEY=${API_KEY:-}
      - ENABLE_REDIS_STATE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # 봇 프로세스
  # =========================================================================

  bot-btc-conservative:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "src.bot_runner", "--bot-name", "btc-conservative"]
    environment:
      - BOT_NAME=btc-conservative
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - MAX_TOTAL_EXPOSURE=${MAX_TOTAL_EXPOSURE:-0}
      - ENABLE_REDIS_STATE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot-eth-balanced:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "src.bot_runner", "--bot-name", "eth-balanced"]
    environment:
      - BOT_NAME=eth-balanced
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - MAX_TOTAL_EXPOSURE=${MAX_TOTAL_EXPOSURE:-0}
      - ENABLE_REDIS_STATE=true
    depends_on:
      bot-btc-conservative:
        condition: service_started
    restart: unless-stopped

  bot-sol-aggressive:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "src.bot_runner", "--bot-name", "sol-aggressive"]
    environment:
      - BOT_NAME=sol-aggressive
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - MAX_TOTAL_EXPOSURE=${MAX_TOTAL_EXPOSURE:-0}
      - ENABLE_REDIS_STATE=true
    depends_on:
      bot-eth-balanced:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
