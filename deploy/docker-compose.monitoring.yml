# ===========================================
# Monitoring Stack Configuration
# ===========================================
# Grafana + Loki + Promtail
# 사용: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up

version: '3.8'

services:
  # Loki - 로그 저장소
  loki:
    image: grafana/loki:2.9.3
    container_name: trading-loki
    ports:
      - "127.0.0.1:3100:3100"  # localhost만 접근 (보안)
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - trading_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail - 로그 수집 에이전트
  promtail:
    image: grafana/promtail:3.3.2
    container_name: trading-promtail
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ../logs:/var/log/trading:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - trading_net
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy

  # Prometheus - 메트릭 수집 서버
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: trading-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - trading_net
    restart: unless-stopped

  # Grafana - 대시보드
  grafana:
    image: grafana/grafana:10.4.2
    container_name: trading-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - trading_net
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
