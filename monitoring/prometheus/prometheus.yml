# =============================================================================
# Prometheus Configuration
# =============================================================================
# Trading Bot 메트릭 수집 설정
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Trading Bot 메트릭 (/metrics 엔드포인트)
  - job_name: 'trading-bot'
    # METRICS_AUTH_TOKEN 설정 시 아래 주석 해제:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['trading-bot:8000']
        labels:
          app: trading
          env: testnet
