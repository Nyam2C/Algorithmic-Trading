# ===========================================
# High-Win Survival System — pyproject.toml
# ruff + pytest + coverage 통합 설정
# ===========================================

# -------------------------------------------
# ruff 린트 설정
# -------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import 정렬)
    "N",     # pep8-naming
    "D",     # pydocstyle (Google 스타일)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (보안)
    "T20",   # flake8-print (print 금지)
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (주석 처리된 코드)
    "PL",    # pylint 부분집합
    "RUF",   # ruff 고유 규칙
    "ASYNC", # flake8-async
]
ignore = [
    # docstring 누락 — 별도 작업으로 단계적 적용
    "D100",    # 모듈 docstring 누락
    "D101",    # 클래스 docstring 누락
    "D102",    # 메서드 docstring 누락
    "D103",    # 함수 docstring 누락
    "D104",    # 패키지 docstring 누락
    "D105",    # 매직 메서드 docstring 누락
    "D106",    # 중첩 클래스 docstring 누락
    "D107",    # __init__ docstring 누락

    # 타입 힌트 모던화 — 73개 파일, 별도 마이그레이션
    "UP006",   # list[X] 대신 List[X] 사용 허용
    "UP007",   # X | None 대신 Optional[X] 사용 허용

    # 트레이딩 봇 특성상 허용
    "PLR0913", # 함수 인자 과다 (설정 객체 특성)
    "RUF012",  # Pydantic ClassVar 어노테이션
    "S311",    # random 모듈 (슬리피지 시뮬레이션)
    "B008",    # FastAPI Depends() 패턴
]

[tool.ruff.lint.per-file-ignores]
# 테스트 파일 — 관대한 규칙
"tests/**/*.py" = [
    "S101",    # assert 허용
    "PLR2004", # 매직 넘버 허용
    "D",       # docstring 불필요
    "ARG",     # 미사용 인자 (fixture)
    "T20",     # print 허용
    "S104",    # 바인딩 주소 (테스트 설정)
    "S105",    # 하드코딩 문자열 (테스트 환경변수)
    "S106",    # 하드코딩 패스워드 (테스트 픽스처)
    "S108",    # 임시 파일 경로 허용
    "B011",    # assert False 허용
    "PLR0915", # 긴 함수 허용
    "PLC0415", # 함수 내 import (테스트 격리)
    "SIM",     # 간소화 불필요
    "ERA001",  # 주석 처리 코드 허용
    "N802",    # 함수명 규칙 완화
    "N806",    # 변수명 대문자 허용 (상수 스타일)
    "E402",    # import 순서 (테스트 setup)
    "E501",    # 긴 줄 허용
    "F841",    # 미사용 변수 허용 (side-effect 테스트)
    "RET504",  # return 전 할당 허용
    "RUF015",  # next(iter()) 패턴 완화
    "RUF059",  # 미사용 __all__ 허용
]
"tests/**/conftest.py" = [
    "S101", "D", "ARG", "T20",
]

# __init__.py — re-export 허용
"**/__init__.py" = [
    "F401",  # unused import (re-export)
    "D104",  # 패키지 docstring
]

# Pydantic 모델 / 설정 파일
"src/config.py" = ["N805", "ARG002"]
"src/bot_config.py" = ["N805", "ARG002"]

# 메인 루프 — 복잡도 허용
"src/main.py" = ["PLR0912", "PLR0915"]

# Discord 봇 — 프레임워크 콜백 패턴
"src/discord_bot/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

# -------------------------------------------
# ruff 포맷 설정 (Black 호환)
# -------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# -------------------------------------------
# pytest 설정 (pytest.ini → 이관)
# -------------------------------------------
[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
minversion = "7.0"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-p", "no:warnings",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "api: Tests that require API calls",
]
log_cli = false
log_cli_level = "INFO"

# -------------------------------------------
# coverage 설정 (.coveragerc → 이관)
# -------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
